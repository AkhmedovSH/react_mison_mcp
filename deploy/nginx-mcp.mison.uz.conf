# Этап 2 — боевой конфиг mcp.mison.uz: TLS и проксирование на сервис mison-mcp (127.0.0.1:3300).
#   sudo install -m 644 deploy/nginx-mcp.mison.uz.conf /etc/nginx/sites-available/mison_mcp
#   sudo nginx -t && sudo systemctl reload nginx
# Сертификат должен уже существовать (этап 1: deploy/nginx-mcp.mison.uz.http.conf + certbot certonly --webroot).

# Общий потолок на адрес: сам сервис тоже считает лимиты (на ключ и на неудачные входы), это защита от наплыва
limit_req_zone $binary_remote_addr zone=mison_mcp:10m rate=30r/s;

server {
	listen 80;
	server_name mcp.mison.uz;

	location /.well-known/acme-challenge/ {
		root /var/www/letsencrypt;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	server_name mcp.mison.uz;

	ssl_certificate /etc/letsencrypt/live/mcp.mison.uz/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/mcp.mison.uz/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options "nosniff" always;

	# Заголовок Authorization с ключом клиента в журнал не попадает (формат combined его не пишет)
	access_log /var/log/nginx/mcp.mison.uz.access.log;
	error_log /var/log/nginx/mcp.mison.uz.error.log;

	# Запросы MCP — небольшие JSON; ответ отчёта может считаться до минуты
	client_max_body_size 1m;

	location /mcp {
		limit_req zone=mison_mcp burst=60 nodelay;

		proxy_pass http://127.0.0.1:3300;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		# Перезаписываем, а не дописываем: сервис доверяет первому адресу из X-Forwarded-For,
		# поэтому присланный клиентом заголовок отбрасываем
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Authorization $http_authorization;

		# Ответ собирается целиком (без потока) — буферизация не мешает, но таймауты нужны под тяжёлые отчёты
		proxy_buffering off;
		proxy_connect_timeout 5s;
		proxy_send_timeout 130s;
		proxy_read_timeout 130s;
	}

	# Проверка живости для мониторинга; наружу отдаётся только версия и счётчик
	location = /health {
		proxy_pass http://127.0.0.1:3300/health;
		proxy_set_header Host $host;
	}

	location / {
		return 404;
	}
}
