# Этап 1 — только порт 80: нужен, чтобы выпустить сертификат. Сертификата ещё нет, https-блок сюда не входит.
#   sudo install -m 644 deploy/nginx-mcp.mison.uz.http.conf /etc/nginx/sites-available/mison_mcp
#   sudo ln -sf /etc/nginx/sites-available/mison_mcp /etc/nginx/sites-enabled/mison_mcp
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/letsencrypt -d mcp.mison.uz
# После этого замените файл на deploy/nginx-mcp.mison.uz.conf (этап 2).
server {
	listen 80;
	server_name mcp.mison.uz;

	location /.well-known/acme-challenge/ {
		root /var/www/letsencrypt;
	}

	location / {
		return 404;
	}
}
